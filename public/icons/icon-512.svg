<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Dice face -->
  <rect x="120" y="120" width="272" height="272" rx="40" fill="white"/>
  <!-- Dots (showing 6) -->
  <circle cx="190" cy="190" r="26" fill="#1e3a5f"/>
  <circle cx="322" cy="190" r="26" fill="#1e3a5f"/>
  <circle cx="190" cy="256" r="26" fill="#1e3a5f"/>
  <circle cx="322" cy="256" r="26" fill="#1e3a5f"/>
  <circle cx="190" cy="322" r="26" fill="#1e3a5f"/>
  <circle cx="322" cy="322" r="26" fill="#1e3a5f"/>
  <!-- Player tokens -->
  <circle cx="80" cy="80" r="36" fill="#dc2626"/>
  <circle cx="432" cy="80" r="36" fill="#16a34a"/>
  <circle cx="80" cy="432" r="36" fill="#2563eb"/>
  <circle cx="432" cy="432" r="36" fill="#eab308"/>
</svg>
